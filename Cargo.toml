[package]
name = "freefire-online"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "ffonline"
path = "src/main.rs"

[dependencies]
ureq = { version = "3", features = ["json"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
lto = true
codegen-units = 1
strip = true